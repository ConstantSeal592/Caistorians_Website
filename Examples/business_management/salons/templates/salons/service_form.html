{% extends "core/base.html" %}

{% block content %}
  <h2>Add New Service for {{ salon.name }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Service</button>
  </form>
  <a href="{% url 'salons:service_list' salon.id %}">Cancel</a>
{% endblock %}
