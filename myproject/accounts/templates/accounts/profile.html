{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Caistorians</a>
    <div class="d-flex">
      <a href="{% url 'logout' %}" class="btn btn-outline-light">Logout</a>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
  <h1 class="mb-4 text-center">My Profile</h1>

  <div class="row">
    <!-- Profile Info -->
    <div class="col-lg-8">
      <div class="card mb-4 shadow-sm rounded-3">
        <div class="card-header bg-primary text-white">
          Account Details
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" 
                     value="{{ request.user.email }}" required>
            </div>

            <!-- Password (change) -->
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <input type="password" class="form-control" id="password" name="password">
              <div class="form-text">Leave blank if you don’t want to change it.</div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phone" name="phone"
                     value="{{ request.user.profile.phone|default:'' }}">
            </div>

            <!-- Date of Birth -->
            <div class="mb-3">
              <label for="dob" class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="dob" name="dob"
                     value="{{ request.user.profile.dob|default:'' }}">
            </div>

            <!-- Save Button -->
            <button type="submit" class="btn btn-success">Save Changes</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="col-lg-4">
      <div class="card shadow-sm rounded-3">
        <div class="card-body text-center">
          <img src="{% static 'images/Logo.png' %}" alt="Logo" 
               class="img-fluid mb-3" style="max-width: 150px;">
          <h5 class="card-title">{{ request.user.username }}</h5>
          <p class="text-muted">Member since {{ request.user.date_joined|date:"F j, Y" }}</p>

          <!-- Billing Button -->
          <a href="{% url 'billing_setup' %}" class="btn btn-outline-primary mt-3 w-100">
            Setup Billing Information
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
