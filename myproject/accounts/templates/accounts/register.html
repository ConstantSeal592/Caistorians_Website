{% load static %} <!-- Allows linking to static files like CSS/JS if needed -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <!-- Card wrapper for a nice centered look -->
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg rounded-4">
        <div class="card-body p-4 text-center">

          <!-- Logo -->
          <img src="{% static 'images/Logo.png' %}" 
               alt="Logo" 
               class="mb-3"
               style="max-width: 120px; height: auto;">

          <!-- Form Title -->
          <h2 class="mb-4">Create an Account</h2>

          <!-- Django Form -->
          <form method="post" novalidate>
            {% csrf_token %}
            
            <!-- Loop through all form fields manually for styling -->
            {% for field in form %}
              <div class="mb-3 text-start">
                <!-- Field label -->
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                
                <!-- Field input itself -->
                {{ field }}
                
                <!-- Display validation errors under the input -->
                {% if field.errors %}
                  <div class="text-danger small">
                    {{ field.errors|striptags }}
                  </div>
                {% endif %}
              </div>
            {% endfor %}

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>

          <!-- Extra links -->
          <p class="mt-3 mb-0">
            Already have an account? <a href="{% url 'login' %}">Login</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!-- refers to forms.py for field definitions -->
