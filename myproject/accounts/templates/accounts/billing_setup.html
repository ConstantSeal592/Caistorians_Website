{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Caistorians</a>
    <div class="d-flex">
      <a href="{% url 'profile' %}" class="btn btn-outline-light">Back to Profile</a>
    </div>
  </div>
</nav>

<!-- Main -->
<div class="container py-5">
  <h1 class="text-center mb-4">Billing Information</h1>

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg rounded-4">
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}

            <!-- Card Number -->
            <div class="mb-3">
              <label for="card_number" class="form-label">Card Number</label>
              <input type="text" id="card_number" name="card_number" class="form-control" required>
            </div>

            <!-- Expiry -->
            <div class="mb-3">
              <label for="expiry" class="form-label">Expiry Date</label>
              <input type="month" id="expiry" name="expiry" class="form-control" required>
            </div>

            <!-- CVV -->
            <div class="mb-3">
              <label for="cvv" class="form-label">CVV</label>
              <input type="password" id="cvv" name="cvv" maxlength="4" class="form-control" required>
            </div>

            <!-- Billing Address -->
            <div class="mb-3">
              <label for="address" class="form-label">Billing Address</label>
              <textarea id="address" name="address" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100">Save Billing Info</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
